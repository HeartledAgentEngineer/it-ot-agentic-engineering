<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Eichhörnchen-Spiel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#111;touch-action:none;-webkit-user-select:none;user-select:none;}
body{display:flex;justify-content:center;align-items:center;}
canvas{display:block;touch-action:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var C=document.getElementById('c'),ctx=C.getContext('2d'),W=480,H=640;
C.width=W;C.height=H;
function resize(){var s=Math.min(window.innerWidth/W,window.innerHeight/H);C.style.width=(W*s)+'px';C.style.height=(H*s)+'px';}
resize();window.addEventListener('resize',resize);

/* ── Bezier-Oval (iOS+Android, kein ctx.ellipse) ── */
function oval(cx,cy,rx,ry){
  var k=0.5523;ctx.beginPath();
  ctx.moveTo(cx+rx,cy);
  ctx.bezierCurveTo(cx+rx,cy-ry*k,cx+rx*k,cy-ry,cx,cy-ry);
  ctx.bezierCurveTo(cx-rx*k,cy-ry,cx-rx,cy-ry*k,cx-rx,cy);
  ctx.bezierCurveTo(cx-rx,cy+ry*k,cx-rx*k,cy+ry,cx,cy+ry);
  ctx.bezierCurveTo(cx+rx*k,cy+ry,cx+rx,cy+ry*k,cx+rx,cy);
  ctx.closePath();
}
function rrect(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

/* ── Konstanten ── */
var TX=215,TTOP=68,TBOT=H*0.695,GROUND_Y=H*0.69,CROWN_Y=188;
var BR=[{x:118,y:228,w:90,h:19,side:'left'},{x:266,y:210,w:86,h:19,side:'right'}];

/* ── Level-System ── */
var LEVELS=[
  {min:0,   name:'Anfänger 🌿',    sk:'normal'},
  {min:5,   name:'Klaumeister ⚡', sk:'cool'},
  {min:25,  name:'FRODO MODUS 💍', sk:'frodo'},
  {min:150, name:'SHREK MODUS 🧅', sk:'shrek'}
];

/* ── State ── */
var state='climb',timer=0;
var nutCount=0,curLvl=0,lvlAnim=0;
var sq={x:TX,y:GROUND_Y,vx:0,vy:0,fr:0,ft:0,osc:0,face:'happy'};
var nut={x:210,y:155,on:true};
function newNut(){return{x:195+Math.random()*38,y:148+Math.random()*20,on:true};}

/* Timers */
var deadT=0,stolenT=0;
/* Gollum jumpscare */
var gollumT=0,gollumDone=false;
/* Donkey (Shrek-Modus) */
var donkey={x:TX+65,osc:0,face:'happy'};
var donkeySpeak={on:false,text:'',alpha:0,hold:0};
var donkeyTimer=120;
var DONKEY_LINES=['HEY SHREK! 🫏','Wir sind BESTE Freunde!','Bist du ein Oger? 🫏','ICH WILL WAFFELN!!!','Schau mal, SHREK! SCHAU!','Sind wir da? Sind wir da?'];
var SHREK_REPLY=['Lass mich IN RUHE!!!','DAS IST MEIN SUMPF!','GEH WEG, ESEL!!!','Ich brauche nur RUHE...','...warum??? WARUM???'];

/* Speech */
var sp={on:false,text:'',alpha:0,hold:0};
function say(t,h){sp={on:true,text:t,alpha:1,hold:h||80};}

/* Particles + Blood */
var parts=[],blood=[];
function burst(x,y,col,n){n=n||14;for(var i=0;i<n;i++){var a=(i/n)*Math.PI*2,s=2.5+Math.random()*5;parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2.5,life:1,col:col});}}
function splat(x,y){for(var i=0;i<20;i++){var a=Math.random()*Math.PI*2,r=Math.random()*35;blood.push({x:x+Math.cos(a)*r*0.7,y:y+Math.sin(a)*r*0.3,r:3+Math.random()*8,life:1});}}

/* Branch shake */
var brkShk=[0,0];

function skin(){return LEVELS[curLvl].sk;}
function checkLvl(){var nl=0;for(var i=0;i<LEVELS.length;i++)if(nutCount>=LEVELS[i].min)nl=i;if(nl>curLvl){curLvl=nl;lvlAnim=220;}}
function checkSpecials(){if(!gollumDone&&nutCount>=100){gollumDone=true;gollumT=200;say('👁 ...?',20);}}

/* ── Input ── */
function pos(e){var r=C.getBoundingClientRect(),sx=W/r.width,sy=H/r.height,s=e.touches?e.touches[0]:e;return{x:(s.clientX-r.left)*sx,y:(s.clientY-r.top)*sy};}
function tap(e){
  e.preventDefault();
  if(gollumT>20) return; /* block input during jumpscare */
  if(state!=='crown') return;
  var p=pos(e),x=p.x,y=p.y;
  if(nut.on){var dx=x-nut.x,dy=y-nut.y;if(dx*dx+dy*dy<44*44){stealNut();return;}}
  for(var i=0;i<BR.length;i++){var b=BR[i];if(x>=b.x-10&&x<=b.x+b.w+10&&y>=b.y-14&&y<=b.y+b.h+14){shake(i);return;}}
}
try{C.addEventListener('touchstart',tap,{passive:false});}catch(e){C.addEventListener('touchstart',tap,false);}
C.addEventListener('click',tap);

/* ── Spiellogik ── */
function stealNut(){
  if(!nut.on||stolenT>0)return;
  nutCount++;checkLvl();checkSpecials();
  burst(nut.x,nut.y,'#FFD700');
  nut.on=false;sq.face='sad';stolenT=1;
  var sk=skin();
  if(sk==='frodo') say('😭 MEIN PREEECIOUS!!!',75);
  else if(sk==='shrek') say('😭 MEIN ZWIBEL!!!',75);
  else say('😭 MEINE NUSS!!!',75);
}
function shake(i){
  brkShk[i]=18;burst(BR[i].x+BR[i].w/2,BR[i].y,'#8B6914');
  sq.face='scared';sq.vx=BR[i].side==='left'?1.8:-1.8;sq.vy=-3.5;
  state='fall';say('😱 AAAHHHH!!!',65);
}
function startClimb(){
  sq.x=TX;sq.y=GROUND_Y;sq.vx=0;sq.vy=0;sq.face='happy';state='climb';deadT=0;
  var sk=skin();
  if(sk==='frodo') say('💍 Weiter!',55);
  else if(sk==='shrek') say('Ich brauch RUHE...',55);
  else say('🌰 Nochmal!',55);
}

/* ── Update ── */
function update(){
  timer++;sq.ft++;if(sq.ft>4){sq.fr++;sq.ft=0;}
  brkShk[0]=Math.max(0,brkShk[0]-1);brkShk[1]=Math.max(0,brkShk[1]-1);
  if(lvlAnim>0)lvlAnim--;
  if(gollumT>0)gollumT--;

  /* Donkey (Shrek only) */
  if(skin()==='shrek'){
    donkey.osc+=0.022;
    donkey.x=TX+55+Math.sin(donkey.osc)*28;
    donkeyTimer--;
    if(donkeyTimer<=0){
      donkeyTimer=180+Math.floor(Math.random()*160);
      donkeySpeak={on:true,text:DONKEY_LINES[Math.floor(Math.random()*DONKEY_LINES.length)],alpha:1,hold:90};
      sq.face='sad';
      say(SHREK_REPLY[Math.floor(Math.random()*SHREK_REPLY.length)],80);
    }
    if(donkeySpeak.on){
      if(donkeySpeak.hold>0)donkeySpeak.hold--;
      else{donkeySpeak.alpha-=0.04;if(donkeySpeak.alpha<=0)donkeySpeak.on=false;}
    }
  }

  /* CLIMB */
  if(state==='climb'){
    sq.x+=(TX-sq.x)*0.08;
    if(sq.y>CROWN_Y){sq.y-=1.9;}
    else{state='crown';sq.osc=0;stolenT=0;
      var sk2=skin();
      say(sk2==='shrek'?'🧅 Wo ist mein Zwibel...':sk2==='frodo'?'💍 Wo ist er?':'🌰 Wo ist die Nuss?',65);}
  }

  /* CROWN */
  if(state==='crown'){
    sq.osc+=0.028;
    sq.x=TX+Math.sin(sq.osc)*32;
    sq.y=CROWN_Y+Math.sin(sq.osc*1.6)*14-5;
    if(stolenT>0){
      stolenT++;
      if(stolenT===65){
        var sk3=skin();
        say(sk3==='shrek'?'😢 Ich such n neuen...':sk3==='frodo'?'😢 Ein neuer...':'😢 Ich such ne neue!',70);
      }
      if(stolenT>=125){nut=newNut();sq.face='happy';stolenT=0;
        var sk4=skin();
        say(sk4==='shrek'?'😤 Da!':'😤 Da ist sie!',55);}
    }
  }

  /* FALL */
  if(state==='fall'){
    sq.vy+=0.58;sq.y+=sq.vy;sq.x+=sq.vx;sq.vx*=0.97;
    if(sq.y>=GROUND_Y){
      sq.y=GROUND_Y;sq.vy=0;sq.vx=0;
      state='dead';deadT=0;
      splat(sq.x,GROUND_Y+5);burst(sq.x,GROUND_Y,'#CC0000',20);
      say('💥 *PLATSCH*',65);
    }
  }

  /* DEAD (South-Park-Style) */
  if(state==='dead'){
    deadT++;
    if(deadT===85)say('😵 Och nö...',65);
    if(deadT===155)say('✨ ICH BIN OKAY!!!',75);
    if(deadT>=195){blood=[];startClimb();}
  }

  /* Speech */
  if(sp.on){if(sp.hold>0)sp.hold--;else{sp.alpha-=0.04;if(sp.alpha<=0)sp.on=false;}}
  parts=parts.filter(function(p){return p.life>0;});
  parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=0.22;p.life-=0.024;});
  blood.forEach(function(b){if(b.life>0.3)b.life-=0.002;});
}

/* ══════════════════════════════════════════════
   DRAW
══════════════════════════════════════════════ */

/* ── Szene ── */
function drawScene(){
  var sk=skin();
  /* Sky */
  var sg=ctx.createLinearGradient(0,0,0,H*0.70);
  if(sk==='frodo'){sg.addColorStop(0,'#0C0400');sg.addColorStop(0.5,'#421200');sg.addColorStop(1,'#993300');}
  else if(sk==='shrek'){sg.addColorStop(0,'#2A3A1A');sg.addColorStop(0.5,'#3A4A28');sg.addColorStop(1,'#8A9A6A');}
  else{sg.addColorStop(0,'#1A6BA0');sg.addColorStop(0.45,'#4FA8D5');sg.addColorStop(1,'#AAD8F0');}
  ctx.fillStyle=sg;ctx.fillRect(0,0,W,H*0.70);

  if(sk==='frodo'){
    var eg=ctx.createRadialGradient(388,58,4,388,58,62);
    eg.addColorStop(0,'rgba(255,110,0,0.95)');eg.addColorStop(0.45,'rgba(180,40,0,0.5)');eg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=eg;ctx.beginPath();ctx.arc(388,58,62,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#FF5500';ctx.beginPath();ctx.arc(388,58,18,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';oval(388,58,5,13);ctx.fill();
  } else if(sk==='shrek'){
    /* Foggy swamp sky */
    for(var fi=0;fi<5;fi++){
      var fa=0.05+Math.sin(timer*0.01+fi)*0.02;
      ctx.fillStyle='rgba(200,220,160,'+fa+')';
      oval(60+fi*90,40+Math.sin(timer*0.008+fi*1.3)*15,55+fi*8,22);ctx.fill();
    }
    /* Fireflies */
    for(var fli=0;fli<8;fli++){
      var flx=50+fli*52+Math.sin(timer*0.04+fli*2.1)*20;
      var fly=H*0.5+Math.sin(timer*0.035+fli*1.7)*40;
      var fla=0.4+Math.sin(timer*0.1+fli)*0.4;
      ctx.fillStyle='rgba(220,255,100,'+fla+')';ctx.beginPath();ctx.arc(flx,fly,2.5,0,Math.PI*2);ctx.fill();
    }
  } else {
    ctx.fillStyle='rgba(255,230,80,0.18)';ctx.beginPath();ctx.arc(395,72,58,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#FDD835';ctx.beginPath();ctx.arc(395,72,33,0,Math.PI*2);ctx.fill();
    cloud(52,65,0.88);cloud(282,37,1.05);cloud(402,88,0.72);
  }

  /* Ground */
  var gg=ctx.createLinearGradient(0,H*0.67,0,H);
  if(sk==='frodo'){gg.addColorStop(0,'#280D00');gg.addColorStop(1,'#0C0400');}
  else if(sk==='shrek'){gg.addColorStop(0,'#2A3E18');gg.addColorStop(0.4,'#1A2E0A');gg.addColorStop(1,'#0D1A05');}
  else{gg.addColorStop(0,'#57A55A');gg.addColorStop(0.3,'#3E8B41');gg.addColorStop(1,'#1B5E20');}
  ctx.fillStyle=gg;ctx.fillRect(0,H*0.67,W,H*0.33);

  if(sk==='shrek'){
    /* Swamp water puddles */
    [[80,H*0.73,50,12],[220,H*0.75,40,10],[360,H*0.72,55,13]].forEach(function(p){
      ctx.fillStyle='rgba(30,60,30,0.7)';oval(p[0],p[1],p[2],p[3]);ctx.fill();
      ctx.strokeStyle='rgba(80,120,60,0.4)';ctx.lineWidth=1.5;oval(p[0],p[1],p[2],p[3]);ctx.stroke();
    });
  } else if(sk==='frodo'){
    for(var li=0;li<7;li++){var lx=30+li*65,lv=0.2+Math.sin(timer*0.05+li)*0.12;ctx.strokeStyle='rgba(255,70,0,'+lv+')';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(lx,H*0.67);ctx.lineTo(lx+7,H*0.67+18);ctx.lineTo(lx+3,H*0.67+36);ctx.stroke();}
  } else {
    ctx.fillStyle='#6DBF67';for(var gx=5;gx<W;gx+=16){var gh=7+Math.sin(gx*0.7)*3;ctx.beginPath();ctx.moveTo(gx,H*0.67);ctx.lineTo(gx+4,H*0.67-gh);ctx.lineTo(gx+8,H*0.67);ctx.fill();}
    [[52,H*0.695],[155,H*0.71],[345,H*0.70],[435,H*0.695]].forEach(function(f){ctx.fillStyle='#F48FB1';ctx.beginPath();ctx.arc(f[0],f[1],5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#388E3C';ctx.fillRect(f[0]-1,f[1],2,9);});
  }

  /* Background decorations */
  [[58,0.54],[378,0.50],[22,0.40],[448,0.60]].forEach(function(d){
    if(sk==='frodo'){
      ctx.fillStyle='#180700';ctx.beginPath();ctx.moveTo(d[0]-36*d[1],H*0.695);ctx.lineTo(d[0],H*0.695-92*d[1]);ctx.lineTo(d[0]+36*d[1],H*0.695);ctx.fill();
      var gv=0.22+Math.sin(timer*0.04+d[0])*0.1;ctx.fillStyle='rgba(255,70,0,'+(gv*0.5)+')';ctx.beginPath();ctx.arc(d[0],H*0.695-92*d[1],11*d[1],0,Math.PI*2);ctx.fill();
    } else if(sk==='shrek'){
      /* Gnarled swamp trees */
      ctx.fillStyle='#2A1A08';ctx.fillRect(d[0]-5*d[1],H*0.695-80*d[1],10*d[1],80*d[1]);
      [['#1A2E0A',0,-78],['#243818',0,-98],['#1E3214',-14,-65],['#2A3E1A',14,-68]].forEach(function(cc){ctx.fillStyle=cc[0];ctx.beginPath();ctx.arc(d[0]+cc[1]*d[1],H*0.695+cc[2]*d[1],28*d[1]*0.6,0,Math.PI*2);ctx.fill();});
      /* Hanging moss */
      ctx.strokeStyle='rgba(60,80,30,0.6)';ctx.lineWidth=1;
      for(var mi=0;mi<3;mi++){ctx.beginPath();ctx.moveTo(d[0]+(-8+mi*8)*d[1],H*0.695-70*d[1]);ctx.lineTo(d[0]+(-5+mi*8)*d[1],H*0.695-50*d[1]);ctx.stroke();}
    } else {
      ctx.fillStyle='#795548';ctx.fillRect(d[0]-7*d[1],H*0.695-86*d[1],14*d[1],86*d[1]);
      [['#33691E',0,-84],['#2E7D32',0,-108],['#388E3C',-15,-68],['#43A047',15,-70]].forEach(function(cc){ctx.fillStyle=cc[0];ctx.beginPath();ctx.arc(d[0]+cc[1]*d[1],H*0.695+cc[2]*d[1],32*d[1]*0.6,0,Math.PI*2);ctx.fill();});
    }
  });

  /* Main tree / Mountain / Swamp tree */
  drawMainStructure(sk);
}

function cloud(x,y,s){ctx.fillStyle='rgba(255,255,255,0.88)';[[0,0,27],[24,-6,21],[46,0,24],[23,11,19]].forEach(function(c){ctx.beginPath();ctx.arc(x+c[0]*s,y+c[1]*s,c[2]*s,0,Math.PI*2);ctx.fill();});}

function drawMainStructure(sk){
  if(sk==='frodo'){
    var mg=ctx.createLinearGradient(TX,TTOP,TX,TBOT);mg.addColorStop(0,'#180700');mg.addColorStop(0.6,'#2B1200');mg.addColorStop(1,'#3A1C00');ctx.fillStyle=mg;
    ctx.beginPath();ctx.moveTo(TX-108,TBOT);ctx.lineTo(TX-68,TBOT-115);ctx.lineTo(TX-32,TBOT-215);ctx.lineTo(TX,TTOP+12);ctx.lineTo(TX+32,TBOT-215);ctx.lineTo(TX+68,TBOT-115);ctx.lineTo(TX+108,TBOT);ctx.fill();
    var lv=0.6+Math.sin(timer*0.05)*0.28,lg=ctx.createRadialGradient(TX,TTOP+12,4,TX,TTOP+12,52);
    lg.addColorStop(0,'rgba(255,195,0,'+lv+')');lg.addColorStop(0.5,'rgba(255,55,0,'+(lv*0.6)+')');lg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=lg;ctx.beginPath();ctx.arc(TX,TTOP+12,52,0,Math.PI*2);ctx.fill();
    for(var sm=0;sm<3;sm++){var soff=Math.sin(timer*0.03+sm)*7,sa=0.13-sm*0.04;ctx.fillStyle='rgba(35,15,5,'+sa+')';ctx.beginPath();ctx.arc(TX+soff,TTOP-8-sm*17,15+sm*7,0,Math.PI*2);ctx.fill();}
    [TX-11,TX+6,TX+19].forEach(function(lx2,li2){var lv3=0.28+Math.sin(timer*0.06+li2)*0.18;ctx.strokeStyle='rgba(255,75,0,'+lv3+')';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(lx2,TTOP+22);ctx.lineTo(lx2+3,TTOP+75);ctx.lineTo(lx2-2,TTOP+125);ctx.stroke();});
    drawBranches('#3A2200');
  } else if(sk==='shrek'){
    /* Gnarled swamp tree */
    ctx.fillStyle='#2A1A08';
    ctx.beginPath();ctx.moveTo(TX-25,TBOT);ctx.bezierCurveTo(TX-30,TBOT-100,TX-18,TTOP+180,TX-15,TTOP+55);ctx.lineTo(TX+15,TTOP+55);ctx.bezierCurveTo(TX+18,TTOP+180,TX+30,TBOT-100,TX+25,TBOT);ctx.fill();
    /* Gnarled foliage (dark) */
    [['#1A2E0A',TX,TTOP+80,88],['#243818',TX-32,TTOP+116,66],['#1E3214',TX+32,TTOP+118,70],['#1A2E0A',TX,TTOP+42,74],['#243818',TX,TTOP+10,52],['#2A3E1A',TX-20,TTOP+62,48]].forEach(function(c){ctx.fillStyle=c[0];ctx.beginPath();ctx.arc(c[1],c[2],c[3],0,Math.PI*2);ctx.fill();});
    /* Hanging moss on main tree */
    ctx.strokeStyle='rgba(60,90,30,0.7)';ctx.lineWidth=2;
    for(var msi=0;msi<6;msi++){var msx=TX-30+msi*12,msy=TTOP+60+Math.sin(msi)*10;ctx.beginPath();ctx.moveTo(msx,msy);ctx.bezierCurveTo(msx+5,msy+15,msx-3,msy+25,msx+2,msy+35);ctx.stroke();}
    drawBranches('#2A1A08');
  } else {
    var tg=ctx.createLinearGradient(TX-22,0,TX+22,0);tg.addColorStop(0,'#4E342E');tg.addColorStop(0.4,'#6D4C41');tg.addColorStop(1,'#4E342E');ctx.fillStyle=tg;
    ctx.beginPath();ctx.moveTo(TX-23,TBOT);ctx.lineTo(TX-13,TTOP+52);ctx.lineTo(TX+13,TTOP+52);ctx.lineTo(TX+23,TBOT);ctx.fill();
    ctx.strokeStyle='#3E2723';ctx.lineWidth=1.2;for(var ty=TTOP+68;ty<TBOT-25;ty+=34){ctx.beginPath();ctx.moveTo(TX-16,ty);ctx.bezierCurveTo(TX-4,ty+9,TX+5,ty-5,TX+16,ty+7);ctx.stroke();}
    drawBranches(sk==='cool'?'#4E342E':'#5D4037');
    var fc=sk==='cool'?['#1B6E20','#2E8032','#33691E','#266029','#2E7D32','#43A047','#388E3C']:['#1B5E20','#2E7D32','#33691E','#256029','#2E7D32','#43A047','#388E3C'];
    [[TX,TTOP+80,92],[TX-36,TTOP+114,70],[TX+36,TTOP+116,74],[TX,TTOP+40,78],[TX,TTOP+8,56],[TX-22,TTOP+60,52],[TX+26,TTOP+54,50]].forEach(function(c,i){ctx.fillStyle=fc[i];ctx.beginPath();ctx.arc(c[0],c[1],c[2],0,Math.PI*2);ctx.fill();});
    ctx.fillStyle='rgba(255,255,255,0.06)';ctx.beginPath();ctx.arc(TX-20,TTOP+25,34,0,Math.PI*2);ctx.fill();
  }
}

function drawBranches(col){
  BR.forEach(function(b,i){
    var shk=Math.sin(timer*0.8)*brkShk[i]*0.5;ctx.save();ctx.translate(0,shk);
    ctx.fillStyle=col;ctx.beginPath();var off=b.side==='left'?-6:6;
    ctx.moveTo(b.x,b.y+b.h);ctx.lineTo(b.x+off,b.y);ctx.lineTo(b.x+b.w+off,b.y);ctx.lineTo(b.x+b.w,b.y+b.h);ctx.closePath();ctx.fill();

  /* Counter */ctx.fillStyle='rgba(0,0,0,0.65)';rrect(W-132,48,126,34,10);ctx.fill();
  var icon=sk==='frodo'?'💍':sk==='shrek'?'🧅':'🌰';
  ctx.fillStyle='#FFD700';ctx.font='bold 14px Arial';ctx.textAlign='center';ctx.fillText(icon+' × '+nutCount+'  gestohlen',W-69,71);
  /* Level badge */var lc=curLvl>=3?'#AACC44':curLvl===2?'#FF8800':curLvl===1?'#FDD835':'#999';
  ctx.fillStyle='rgba(0,0,0,0.65)';rrect(8,48,110,34,10);ctx.fill();ctx.fillStyle=lc;ctx.font='bold 11px Arial';ctx.textAlign='center';ctx.fillText(LEVELS[curLvl].name,63,71);
  /* Hint */if(state==='climb'){ctx.save();ctx.globalAlpha=0.5+Math.sin(timer*0.08)*0.35;ctx.fillStyle=tc;ctx.font='bold 13px Arial';ctx.textAlign='center';ctx.fillText('⬆️ klettert...',W/2,H-16);ctx.restore();}
}

function drawLevelUp(){
  if(lvlAnim<=0)return;
  var a=lvlAnim>30?1:lvlAnim/30,sc=lvlAnim>165?1+(220-lvlAnim)*0.014:1;
  ctx.save();ctx.globalAlpha=a;ctx.translate(W/2,H/2);ctx.scale(sc,sc);
  ctx.fillStyle='rgba(0,0,0,0.7)';rrect(-145,-72,290,144,22);ctx.fill();
  var lc=curLvl>=3?'#AACC44':curLvl===2?'#FF8800':'#FFD700';
  ctx.fillStyle=lc;ctx.font='bold 24px Arial';ctx.textAlign='center';ctx.shadowColor=lc;ctx.shadowBlur=22;ctx.fillText('🎉  LEVEL UP!  🎉',0,-20);ctx.shadowBlur=0;
  ctx.fillStyle='#fff';ctx.font='bold 17px Arial';ctx.fillText(LEVELS[curLvl].name,0,15);
  if(curLvl===2){ctx.fillStyle='#FFB300';ctx.font='13px Arial';ctx.fillText('Das Eichhörnchen wird zu Frodo!',0,44);}
  if(curLvl===3){ctx.fillStyle='#AACC44';ctx.font='13px Arial';ctx.fillText('Frodo wird zu SHREK! 🧅',0,44);ctx.fillText('Esel folgt ihm überall hin 🫏',0,62);}
  ctx.restore();
}

function drawParticles(){parts.forEach(function(p){ctx.save();ctx.globalAlpha=p.life;ctx.fillStyle=p.col;ctx.shadowColor=p.col;ctx.shadowBlur=6;oval(p.x,p.y,5*p.life,5*p.life);ctx.fill();ctx.restore();});}

/* ── Loop ── */
function draw(){
  ctx.clearRect(0,0,W,H);ctx.textAlign='left';
  drawScene();drawNut();drawAll();drawParticles();drawSpeech();drawHUD();drawLevelUp();
  drawGollum(); /* overlay – immer zuletzt */
}
function loop(){update();draw();requestAnimationFrame(loop);}
nut=newNut();say('🌰 Ich hol mir meine Nuss!',80);loop();
</script>
