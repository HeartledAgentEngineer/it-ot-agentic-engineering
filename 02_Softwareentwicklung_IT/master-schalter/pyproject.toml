[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "master-schalter"
version = "0.5.1"
description = "Zeigt Kontingente und aktiven Master von Claude Code und Codex in der Windows-Taskleiste und wechselt den Master per Klick."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
leiste = ["pystray>=0.19.5", "Pillow>=10.4"]
dev = ["pytest>=8.3"]

[project.scripts]
masterwechsel = "master_schalter.cli:main"
master-schalter = "master_schalter.uebersicht:main"
master-leiste = "master_schalter.leiste:main"

[project.gui-scripts]
master-schalter-gui = "master_schalter.uebersicht:main"
master-leiste-gui = "master_schalter.leiste:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
