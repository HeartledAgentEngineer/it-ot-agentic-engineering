<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0f1a">
    <meta name="description" content="Personal AI Agent – Dein persönlicher KI-Assistent">
    <title>Personal AI Agent</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header id="header">
            <div class="header-content">
                <h1 class="app-title">🤖 Agent</h1>
                <span id="status-indicator" class="status offline" title="Verbindungsstatus">
                    <span class="status-dot"></span>
                    <span class="status-text">Offline</span>
                </span>
            </div>
        </header>

        <!-- Chat Messages -->
        <main id="chat-container">
            <div id="messages">
                <!-- Welcome message -->
                <div class="message assistant">
                    <div class="message-content">
                        <p>👋 Hallo! Ich bin dein persönlicher KI-Assistent.</p>
                        <p>Stell mir eine Frage oder erzähl mir etwas – ich merke mir Dinge für dich!</p>
                        <p class="hint">💡 <em>Ich bin spezialisiert auf Netzwerktechnik, IT-Security und Systemadministration.</em></p>
                    </div>
                </div>
            </div>

            <!-- Loading indicator -->
            <div id="loading" class="hidden">
                <div class="typing-indicator">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <span class="loading-text">Denke nach...</span>
            </div>
        </main>

        <!-- Input Area -->
        <footer id="input-area">
            <div class="input-wrapper">
                <textarea id="message-input" rows="1" placeholder="Nachricht eingeben..." maxlength="10000"></textarea>
                <button id="mic-btn" class="icon-btn" title="Spracheingabe">
                    <svg viewBox="0 0 24 24" width="24" height="24">
                        <path fill="currentColor" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                        <path fill="currentColor" d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                    </svg>
                </button>
                <button id="send-btn" class="icon-btn send-btn" title="Nachricht senden" disabled>
                    <svg viewBox="0 0 24 24" width="24" height="24">
                        <path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </div>
            <!-- Werkzeugleiste direkt an der Eingabe: Bei geöffneter Tastatur
                 ist die Kopfzeile auf dem Handy nicht mehr erreichbar. -->
            <div class="input-tools">
                <button id="web-btn" class="tool-toggle" aria-pressed="false"
                        title="Websuche aus – jede Suche kostet rund 0,7 Cent">
                    <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
                        <path fill="currentColor" d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm6.93 6h-2.95a15.65 15.65 0 00-1.38-3.56A8.03 8.03 0 0118.92 8zM12 4.04c.83 1.2 1.48 2.53 1.91 3.96h-3.82c.43-1.43 1.08-2.76 1.91-3.96zM4.26 14C4.1 13.36 4 12.69 4 12s.1-1.36.26-2h3.38c-.08.66-.14 1.32-.14 2s.06 1.34.14 2H4.26zm.82 2h2.95c.32 1.25.78 2.45 1.38 3.56A7.987 7.987 0 015.08 16zm2.95-8H5.08a7.987 7.987 0 014.33-3.56A15.65 15.65 0 008.03 8zM12 19.96c-.83-1.2-1.48-2.53-1.91-3.96h3.82c-.43 1.43-1.08 2.76-1.91 3.96zM14.34 14H9.66c-.09-.66-.16-1.32-.16-2s.07-1.35.16-2h4.68c.09.65.16 1.32.16 2s-.07 1.34-.16 2zm.25 5.56c.6-1.11 1.06-2.31 1.38-3.56h2.95a8.03 8.03 0 01-4.33 3.56zM16.36 14c.08-.66.14-1.32.14-2s-.06-1.34-.14-2h3.38c.16.64.26 1.31.26 2s-.1 1.36-.26 2h-3.38z"/>
                    </svg>
                    <span>Web</span>
                </button>
                <button id="model-btn" class="tool-toggle" title="Modell wählen">
                    <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
                        <path fill="currentColor" d="M12 2l2.4 5.4L20 8.6l-4 3.9.9 5.5-4.9-2.6-4.9 2.6.9-5.5-4-3.9 5.6-1.2z"/>
                    </svg>
                    <span id="model-label">Modell</span>
                </button>
                <button id="privacy-btn" class="tool-toggle" aria-pressed="false"
                        title="Datenschutz-Riegel aus – OpenRouter darf zu Anbietern routen, die Prompts speichern">
                    <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
                        <path fill="currentColor" d="M12 1L3 5v6c0 5.5 3.8 10.7 9 12 5.2-1.3 9-6.5 9-12V5l-9-4zm0 10.9h7c-.5 4.1-3.2 7.8-7 9V12H5V6.3l7-3.1v8.7z"/>
                    </svg>
                    <span id="privacy-label">Riegel</span>
                </button>
                <span class="footer-note">Gedächtnis aktiv</span>
            </div>
        </footer>
    </div>

    <!-- Modellauswahl. Liegt ausserhalb von #app, damit sie den Chat
         überlagert statt ihn zu verschieben. -->
    <div id="model-sheet" hidden>
        <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="Modell wählen">
            <div class="sheet-head">
                <h2>Modell wählen</h2>
                <button id="model-close" class="sheet-close" title="Schließen" aria-label="Schließen">&times;</button>
            </div>
            <div class="sheet-search">
                <input id="model-search" type="search" placeholder="Alle Modelle durchsuchen …"
                       autocomplete="off" aria-label="Modelle durchsuchen">
            </div>
            <div id="model-filters" class="sheet-filters" role="group" aria-label="Filter">
                <button class="filter-chip" data-filter="speicherfrei"
                        title="Nur Modelle, bei denen kein möglicher Anbieter Prompts speichert">Kein Speichern</button>
                <button class="filter-chip" data-filter="eu"
                        title="Würde über den EU-Endpunkt bedient (erfordert Enterprise)">EU-fähig</button>
                <button class="filter-chip" data-filter="reasoning"
                        title="Beherrscht schrittweises Denken">Denkt mit</button>
                <button class="filter-chip" data-filter="bilder"
                        title="Versteht Bilder und Dateien">Bilder/Dateien</button>
            </div>
            <div id="model-list" class="sheet-list"></div>
            <p id="model-hint" class="sheet-note"></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
