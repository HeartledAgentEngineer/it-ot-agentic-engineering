<!DOCTYPE html>

<head><meta charset="UTF-8"><title>Hermes Live-Status</title>

<style>
body{font-family:sans-serif;background:#111;color:#eee;max-width:600px;margin:20px auto;padding:0 10px}
h1{font-size:18px;margin-bottom:5px;color:#888}

.meldung .zeit{color:#666;font-size:11px}
#hermes{display:none;background:#0a2a0a;padding:15px;border-radius:8px;margin:10px 0;border:1px #0a0 solid}
#hermes.aktiv{display:block}
.hermes-thought{color:#8f8;margin:4px 0;padding:4px 8px;background:#111;border-radius:4px;border-left:2px #0f0 solid;font-size:13px;white-space:pre-wrap}

<h1>🤖 Hermes Live-Status</h1>
<p style="color:#666;font-size:12px">Aktualisiert alle 3s · <span id="info">warte...</span></p>
